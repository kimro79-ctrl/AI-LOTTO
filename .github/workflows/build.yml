name: Android Release Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 아티팩트 삭제(DELETE) API를 쓰려면 actions: write 권한이 필요해서 명시적으로 추가했다.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 새 빌드를 시작하기 전에, 이 저장소에 쌓여 있는 아티팩트 중 "최근 20개"만 남기고
      # 그보다 오래된 것들을 지운다. 최근 20개는 롤백/재배포 대비용으로 남겨둔다.
      # ubuntu-latest 러너엔 GitHub CLI(gh)와 jq가 기본 설치돼 있어서 별도 액션 설치 없이 바로 쓸 수 있다.
      # ⚠️ gh api는 --slurp와 -q(jq 쿼리)를 동시에 쓸 수 없어서, 먼저 -q로 아티팩트를 한 줄에
      # 하나씩(JSON) 뽑아낸 뒤, 그 결과 전체를 별도의 jq -s(slurp)로 모아 정렬·필터링한다.
      - name: Delete Old Artifacts (keep latest 20)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Looking for artifacts older than the most recent 20 in ${{ github.repository }}..."
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            -q '.artifacts[] | {id, created_at}' \
            | jq -s 'sort_by(.created_at) | reverse | .[20:] | .[].id')

          if [ -z "$ARTIFACT_IDS" ]; then
            echo "20 or fewer artifacts exist. Nothing to delete."
          else
            for id in $ARTIFACT_IDS; do
              echo "Deleting old artifact ID: $id"
              gh api "repos/${{ github.repository }}/actions/artifacts/$id" -X DELETE || true
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper 8.9
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Gradle Properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Auto Increment Version Code & Name
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          GRADLE_FILE="app/build.gradle.kts"
          
          echo "Using gradle file: $GRADLE_FILE"
          
          # Kotlin DSL (build.gradle.kts) 전용 정확한 패턴 변경
          sed -i 's/versionCode = [0-9]*/versionCode = '$BUILD_NUMBER'/g' $GRADLE_FILE
          sed -i 's/versionName = "[^"]*"/versionName = "1.0.'$BUILD_NUMBER'"/g' $GRADLE_FILE
          
          echo "Updated Version Code to $BUILD_NUMBER and Version Name to 1.0.$BUILD_NUMBER"

      - name: Build Release App Bundle (Signed)
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Print Keystore SHA Fingerprints
        run: |
          keytool -list -v -keystore app/upload-keystore.jks -alias "${{ secrets.ALIAS }}" -storepass "${{ secrets.STORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}"

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
