File Path: .github/workflows/build.yml
name: Android API 36 Build Pipeline

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'

- name: Inject Gradle Properties
run: |
echo "android.useAndroidX=true" >> gradle.properties
echo "android.nonTransitiveRClass=true" >> gradle.properties
echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties
echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

- name: Setup Gradle 8.7
uses: gradle/actions/setup-gradle@v3
with:
gradle-version: '8.7'

- name: Build Debug APK
run: gradle assembleDebug

- name: Upload Debug APK Artifact
uses: actions/upload-artifact@v4
if: success()
with:
name: lotto-app-debug
path: app/build/outputs/apk/debug/app-debug.apk
