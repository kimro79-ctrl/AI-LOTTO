name: Android Release Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper 8.7
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Gradle Properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Auto Increment Version Code & Name
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          GRADLE_FILE="app/build.gradle.kts"
          
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="app/build.gradle"
          fi

          echo "Using gradle file: $GRADLE_FILE"
          
          # build.gradle.kts (Kotlin DSL) 형식에 맞춰 versionCode 및 versionName 자동 업데이트
          sed -i "s/versionCode = [0-9]*/versionCode = $BUILD_NUMBER/g" $GRADLE_FILE
          sed -i 's/versionName = "[^"]*"/versionName = "1.0.'$BUILD_NUMBER'"/g' $GRADLE_FILE
          
          # build.gradle (Groovy) 형식일 경우를 위한 대체 반영
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/g" $GRADLE_FILE
          sed -i 's/versionName "[^"]*"/versionName = "1.0.'$BUILD_NUMBER'"/g' $GRADLE_FILE
          
          echo "Updated Version Code to $BUILD_NUMBER and Version Name to 1.0.$BUILD_NUMBER"

      - name: Build Release App Bundle (Signed)
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Print Keystore SHA Fingerprints
        run: |
          keytool -list -v -keystore app/upload-keystore.jks -alias "${{ secrets.ALIAS }}" -storepass "${{ secrets.STORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}"

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
